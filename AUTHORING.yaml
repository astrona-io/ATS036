version: 1
approval: Maintainer requested CKA and CKS playgrounds and graded labs on 2026-10-13, superseding the
  earlier reading-only scope.
course:
  id: ATS036
  certification:
    name: Certified Kubernetes Security Specialist
    code: CKS
    provider: CNCF / Linux Foundation
    domain: Monitoring, Logging and Runtime Security
    weight: 20
    competencies:
    - Perform behavioral analytics to detect malicious activities
    - Detect threats within physical infrastructure, apps, networks, data, users and workloads
    - Investigate and identify phases of attack and bad actors within the environment
    - Ensure immutability of containers at runtime
    - Use Kubernetes audit logs to monitor access
defaults:
  playground: true
  module_lab: false
  capstone: false
  section_quiz: false
  final_quiz: true
assessment_format: YAML question banks v1, registered in assessments/index.yaml
sections:
- id: section-010
  title: Perform behavioral analytics to detect malicious activities
  curriculum_item: Perform behavioral analytics to detect malicious activities
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Behavioral Detection With Runtime Context
    objectives:
    - Build an expected behavior model for a workload.
    - Relate syscall and process observations to security hypotheses.
    - Explain runtime rule scope and detection limitations.
    - Choose proportionate investigation and containment evidence.
    outline:
    - Expected Behavior Of A Workload
    - Syscalls, eBPF And Falco Rules
    - Audit Records As Behavioral Evidence
    - Triage, Tuning And Response To An Alert
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-01/course-01-expected-behavior-of-a-workload.md
      adapted_from: null
    - reading: sections/section-010/module-01/course-02-syscalls-ebpf-and-falco-rules.md
      adapted_from: null
    - reading: sections/section-010/module-01/course-03-audit-records-as-behavioral-evidence.md
      adapted_from: null
    - reading: sections/section-010/module-01/course-04-triage-tuning-and-response.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-010/module-01/labs/lab-01
      after_reading: sections/section-010/module-01/course-03-audit-records-as-behavioral-evidence.md
      objective: Classify a real denied Secret request and bind the finding to its actor and audit identifier.
      status: alpha
      runtime_verification: passed
    - id: lab-02
      path: sections/section-010/module-01/labs/lab-02
      after_reading: sections/section-010/module-01/course-04-triage-tuning-and-response.md
      objective: Keep a suspicious Pod for analysis with an ephemeral debug container, then relabel it
        so its Service and Deployment let it go while a replacement starts.
      status: alpha
      runtime_verification: passed
    practice_readings:
    - sections/section-010/module-01/course-01-expected-behavior-of-a-workload.md
    - sections/section-010/module-01/course-02-syscalls-ebpf-and-falco-rules.md
    - sections/section-010/module-01/course-03-audit-records-as-behavioral-evidence.md
    - sections/section-010/module-01/course-04-triage-tuning-and-response.md
    quiz: sections/section-010/module-01/quiz.yaml
  - id: module-02
    title: Writing Runtime Detection Rules
    objectives:
    - Name the parts of a Falco rule file and say what each part does.
    - Write a rule condition limited to containers, a namespace and a set of process names.
    - Add an exception for approved behavior without disabling the rule.
    - Explain what a process rule cannot see.
    - Prove live shell detection and a narrow exception with real kernel events.
    - Fresh shell events in the protected namespace include real Kubernetes identity; Approved commands
      and an outside namespace remain silent while a later protected event is detected
    outline:
    - Anatomy Of A Falco Rule File
    - Scope A Shell Rule To A Namespace
    - Exceptions, Testing And Limits Of A Rule
    - Test A Live Sensor In A Linux VM
    - Join A Runtime Event To Kubernetes Identity
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-02/course-01-anatomy-of-a-falco-rule-file.md
      adapted_from: null
    - reading: sections/section-010/module-02/course-02-scope-a-shell-rule-to-a-namespace.md
      adapted_from: null
    - reading: sections/section-010/module-02/course-03-exceptions-testing-and-limits-of-a-rule.md
      adapted_from: null
    - reading: sections/section-010/module-02/course-04-test-a-live-sensor-in-a-linux-vm.md
      adapted_from: null
    - reading: sections/section-010/module-02/course-05-detect-with-kubernetes-metadata.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-010/module-02/labs/lab-01
      after_reading: sections/section-010/module-02/course-02-scope-a-shell-rule-to-a-namespace.md
      objective: Store a runtime rule scoped to containers, one namespace and shell names, with a useful
        output.
      status: alpha
      runtime_verification: passed
    - id: lab-02
      path: sections/section-010/module-02/labs/lab-02
      after_reading: sections/section-010/module-02/course-04-test-a-live-sensor-in-a-linux-vm.md
      objective: New sh and bash shells of probe-user raise Unexpected probe shell alerts with priority
        WARNING, the command line and the account.
      status: alpha
      runtime_verification: passed
    - id: lab-03
      path: sections/section-010/module-02/labs/lab-03
      after_reading: sections/section-010/module-02/course-05-detect-with-kubernetes-metadata.md
      objective: New shells in the reporter Pod of starfleet-036-010-02-03 raise Training namespace shell
        alerts with the namespace, Pod name and Pod UID.
      status: alpha
      runtime_verification: passed
    practice_readings:
    - sections/section-010/module-02/course-01-anatomy-of-a-falco-rule-file.md
    - sections/section-010/module-02/course-02-scope-a-shell-rule-to-a-namespace.md
    - sections/section-010/module-02/course-03-exceptions-testing-and-limits-of-a-rule.md
    - sections/section-010/module-02/course-04-test-a-live-sensor-in-a-linux-vm.md
    - sections/section-010/module-02/course-05-detect-with-kubernetes-metadata.md
    quiz: sections/section-010/module-02/quiz.yaml
  - id: module-03
    title: Detecting Command Execution Through API Audit Records
    objectives:
    - Say which audit policy rule records exec and portforward requests.
    - Find the audit record of a kubectl exec request and name its Pod.
    - Name the authenticated user, groups, source address and client of a request.
    - Explain what an exec audit record proves and what it does not prove.
    outline:
    - Exec And Port-Forward In The Audit Log
    - 'Who Sent The Request: Identity And Origin'
    - Correlating Audit Records With Other Evidence
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-03/course-01-exec-and-port-forward-in-the-audit-log.md
      adapted_from: null
    - reading: sections/section-010/module-03/course-02-who-sent-the-request-identity-and-origin.md
      adapted_from: null
    - reading: sections/section-010/module-03/course-03-correlating-audit-records-with-other-evidence.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-010/module-03/labs/lab-01
      after_reading: sections/section-010/module-03/course-02-who-sent-the-request-identity-and-origin.md
      objective: Bind an exec finding to its actor, Pod, stage and audit identifier.
      status: alpha
      runtime_verification: passed
    - id: lab-02
      path: sections/section-010/module-03/labs/lab-02
      after_reading: sections/section-010/module-03/course-03-correlating-audit-records-with-other-evidence.md
      objective: Link a pods/exec audit record to the Pod and container named in the request, the node
        that runs the Pod and the container ID from the Pod status.
      status: alpha
      runtime_verification: passed
    practice_readings:
    - sections/section-010/module-03/course-01-exec-and-port-forward-in-the-audit-log.md
    - sections/section-010/module-03/course-02-who-sent-the-request-identity-and-origin.md
    - sections/section-010/module-03/course-03-correlating-audit-records-with-other-evidence.md
