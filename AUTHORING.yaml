version: 1
approval: Maintainer requested CKA and CKS playgrounds and graded labs on 2026-10-13, superseding the
  earlier reading-only scope.
course:
  id: ATS036
  certification:
    name: Certified Kubernetes Security Specialist
    code: CKS
    provider: CNCF / Linux Foundation
    domain: Monitoring, Logging and Runtime Security
    weight: 20
    competencies:
    - Perform behavioral analytics to detect malicious activities
    - Detect threats within physical infrastructure, apps, networks, data, users and workloads
    - Investigate and identify phases of attack and bad actors within the environment
    - Ensure immutability of containers at runtime
    - Use Kubernetes audit logs to monitor access
defaults:
  playground: true
  module_lab: false
  capstone: false
  section_quiz: false
  final_quiz: true
assessment_format: YAML question banks v1, registered in assessments/index.yaml
sections:
- id: section-010
  title: Perform behavioral analytics to detect malicious activities
  curriculum_item: Perform behavioral analytics to detect malicious activities
  capstone: true
  section_quiz: false
  modules:
  - id: module-01
    title: Behavioral Detection With Runtime Context
    objectives:
    - Build an expected behavior model for a workload.
    - Relate syscall and process observations to security hypotheses.
    - Explain runtime rule scope and detection limitations.
    - Choose proportionate investigation and containment evidence.
    outline:
    - Behavioral Detection With Runtime Context
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-010/module-01/course-01-behavioral-detection-with-runtime-context.md
      adapted_from: null
    - reading: sections/section-010/module-01/course-02-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-010/module-01/labs/lab-01
      after_reading: sections/section-010/module-01/course-01-behavioral-detection-with-runtime-context.md
      objective: Classify a real denied Secret request and bind the finding to its actor and audit identifier.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-010/module-01/course-02-guided-practice.md
  - id: module-02
    title: Writing Runtime Detection Rules
    objectives:
    - Name the parts of a Falco rule file and say what each part does.
    - Write a rule condition limited to containers, a namespace and a set of process names.
    - Add an exception for approved behavior without disabling the rule.
    - Explain what a process rule cannot see.
    - Prove live shell detection and a narrow exception with real kernel events.
    - Report a denied Secret request and an exec from the audit log, then quarantine the Pod without deleting
      it.
    - Fresh shell events in the protected namespace include real Kubernetes identity; Approved commands
      and an outside namespace remain silent while a later protected event is detected
    outline:
    - Anatomy Of A Falco Rule File
    - Scope A Shell Rule To A Namespace
    - Exceptions, Testing And Limits Of A Rule
    - Test A Live Sensor In A Linux VM
    - Join A Runtime Event To Kubernetes Identity
    playground: true
    module_lab: true
    labs:
    - id: lab-01
      path: sections/section-010/module-02/labs/lab-01
      after_reading: sections/section-010/module-02/course-02-scope-a-shell-rule-to-a-namespace.md
      objective: Store a runtime rule scoped to containers, one namespace and shell names, with a useful
        output.
      status: alpha
      runtime_verification: pending
    - id: lab-02
      path: sections/section-010/module-02/labs/lab-02
      after_reading: sections/section-010/module-02/course-03a-test-a-live-sensor-in-a-linux-vm.md
      objective: Prove live shell detection and a narrow exception with real kernel events.
      status: alpha
      runtime_verification: pending
    - id: lab-01
      path: sections/section-010/capstone/labs/lab-01
      after_reading: sections/section-010/module-02/course-03a-test-a-live-sensor-in-a-linux-vm.md
      objective: Report a denied Secret request and an exec from the audit log, then quarantine the Pod
        without deleting it.
      status: alpha
      runtime_verification: pending
    - id: lab-03
      path: sections/section-010/module-02/labs/lab-03
      after_reading: sections/section-010/module-02/course-03b-detect-with-kubernetes-metadata.md
      objective: Fresh shell events in the protected namespace include real Kubernetes identity; Approved
        commands and an outside namespace remain silent while a later protected event is detected
      status: alpha
      runtime_verification: pending
    sources:
    - reading: sections/section-010/module-02/course-03a-test-a-live-sensor-in-a-linux-vm.md
      adapted_from: null
    - reading: sections/section-010/module-02/course-03b-detect-with-kubernetes-metadata.md
      adapted_from: null
  - id: module-03
    title: Detecting Command Execution Through API Audit Records
    objectives:
    - Say which audit policy rule records exec and portforward requests.
    - Find the audit record of a kubectl exec request and name its Pod.
    - Name the authenticated user, groups, source address and client of a request.
    - Explain what an exec audit record proves and what it does not prove.
    outline:
    - Exec And Port-Forward In The Audit Log
    - Who Sent The Request: Identity And Origin
    - Correlating Audit Records With Other Evidence
    playground: true
    module_lab: true
    labs:
    - id: lab-01
      path: sections/section-010/module-03/labs/lab-01
      after_reading: sections/section-010/module-03/course-02-who-sent-the-request-identity-and-origin.md
      objective: Bind an exec finding to its actor, Pod, stage and audit identifier.
      status: alpha
      runtime_verification: pending
- id: section-020
  title: Detect threats within physical infrastructure, apps, networks, data, users and workloads
  curriculum_item: Detect threats within physical infrastructure, apps, networks, data, users and workloads
  capstone: true
  section_quiz: false
  modules:
  - id: module-01
    title: Security Observability And Evidence Quality
    objectives:
    - Distinguish API audit, runtime and application security observations.
    - Explain telemetry collection and retention trust boundaries.
    - Relate alert quality to relevant behaviors and response ownership.
    - Identify sensitive fields and evidence gaps.
    outline:
    - Collection, Storage And Observation Limits
    - Security Signals Across Different Boundaries
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-020/module-01/course-01-collection-storage-and-observation-limits.md
      adapted_from: ATS045/sections/section-030/module-01/course-01-collection-storage-and-observation-limits.md
    - reading: sections/section-020/module-01/course-02-security-signals-across-different-boundaries.md
      adapted_from: ATS045/sections/section-030/module-01/course-02-security-signals-across-different-boundaries.md
    - reading: sections/section-020/module-01/course-03-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-020/module-01/labs/lab-01
      after_reading: sections/section-020/module-01/course-02-security-signals-across-different-boundaries.md
      objective: Select the previous container log and record the corresponding exit evidence.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-020/module-01/course-03-guided-practice.md
  - id: module-02
    title: Detecting Risky Workloads From Events, Specifications And Logs
    objectives:
    - Read the events of a Pod and explain why events are short-lived.
    - Find privileged containers and host directory mounts in Pod specifications.
    - Count security-relevant application log lines and judge them by rate and source.
    outline:
    - Kubernetes Events As A Short-Lived Signal
    - Reading A Pod Specification For Risky Settings
    - Application Log Signals Of Abuse
  - id: module-03
    title: Detecting Threats To Data And User Accounts
    objectives:
    - Name ServiceAccount identities and find the account a Pod uses.
    - Test which accounts can read Secrets and find the granting binding.
    - List the paths along which a Secret value can be read.
    outline:
    - ServiceAccounts And User Identity
    - Who Can Read Secrets
    - Secret Exposure Paths
- id: section-030
  title: Investigate and identify phases of attack and bad actors within the environment
  curriculum_item: Investigate and identify phases of attack and bad actors within the environment
  capstone: true
  section_quiz: false
  modules:
  - id: module-01
    title: Reconstructing Attack Phases And Actor Authority
    objectives:
    - Build a timeline from API, application, host and network evidence.
    - Distinguish observed actor identity from the human behind a credential.
    - Relate initial access, escalation, persistence and impact hypotheses.
    - Contain compromised authority and preserve useful evidence.
    outline:
    - Reconstructing Attack Phases And Actor Authority
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-01/course-01-reconstructing-attack-phases-and-actor-authority.md
      adapted_from: null
    - reading: sections/section-030/module-01/course-02-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-030/module-01/labs/lab-01
      after_reading: sections/section-030/module-01/course-01-reconstructing-attack-phases-and-actor-authority.md
      objective: Classify a real denied Secret request and bind the finding to its actor and audit identifier.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-030/module-01/course-02-guided-practice.md
  - id: module-02
    title: Finding Persistence And Escalated Authority
    objectives:
    - List the objects an attacker can use to persist.
    - Follow ownerReferences from a Pod to the controller that recreates it.
    - Test what a ServiceAccount can do and find the binding behind it.
    - Contain a persistent workload by preserving it, scaling it to zero and removing the binding.
    outline:
    - Persistence In Workload Templates And Schedules
    - Privilege Escalation Through Bindings And Pod Settings
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-02/course-01-persistence-in-workload-templates-and-schedules.md
      adapted_from: null
    - reading: sections/section-030/module-02/course-02-privilege-escalation-through-bindings-and-pod-settings.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-030/module-02/labs/lab-01
      after_reading: sections/section-030/module-02/course-02-privilege-escalation-through-bindings-and-pod-settings.md
      objective: Find the controller and binding behind an unexpected Pod, record them and contain both.
      status: alpha
      runtime_verification: pending
    practice_readings: []
  - id: module-03
    title: Tracing Lateral Movement And Impact
    objectives:
    - Map a client address in an application log to a Pod.
    - Separate kubelet and component requests from an intruder.
    - State what a missing log line does and does not prove.
    - Find signs of impact in limits, restarts and events.
    outline:
    - Lateral Movement And Network Evidence
    - Impact And Resource Abuse
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-030/module-03/course-01-lateral-movement-and-network-evidence.md
      adapted_from: null
    - reading: sections/section-030/module-03/course-02-impact-and-resource-abuse.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-030/module-03/labs/lab-01
      after_reading: sections/section-030/module-03/course-01-lateral-movement-and-network-evidence.md
      objective: Identify the Pod that sends unexpected requests to the probe Service and record its address.
      status: alpha
      runtime_verification: pending
    practice_readings: []
- id: section-040
  title: Ensure immutability of containers at runtime
  curriculum_item: Ensure immutability of containers at runtime
  capstone: true
  section_quiz: false
  modules:
  - id: module-01
    title: Constraining Runtime Mutation And Writable Paths
    objectives:
    - Explain read-only root filesystems and their limits.
    - Separate required temporary data from executable image content.
    - Relate capabilities, identity and host mounts to immutability.
    - Evaluate replacement-based updates and residual compromise paths.
    outline:
    - Constraining Runtime Mutation And Writable Paths
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-01/course-01-constraining-runtime-mutation-and-writable-paths.md
      adapted_from: null
    - reading: sections/section-040/module-01/course-02-guided-practice.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-040/module-01/labs/lab-01
      after_reading: sections/section-040/module-01/course-01-constraining-runtime-mutation-and-writable-paths.md
      objective: Keep a non-root workload functional with a read-only root filesystem and a writable scratch
        volume.
      status: alpha
      runtime_verification: pending
    practice_readings:
    - sections/section-040/module-01/course-02-guided-practice.md
  - id: module-02
    title: 'Dropping Privileges: Identity, Capabilities And Privilege Escalation'
    objectives:
    - Name the default capabilities of a container and the risk of each.
    - Drop all capabilities and read the result from /proc/1/status.
    - Run as a non-root user and set no_new_privs.
    - Find and block privileged containers.
    outline:
    - Linux Capabilities And What A Container Starts With
    - Non-Root Identity And Privilege Escalation
    - Privileged Containers And Verifying Process Privileges
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-02/course-01-linux-capabilities-and-what-a-container-starts-with.md
      adapted_from: null
    - reading: sections/section-040/module-02/course-02-non-root-identity-and-privilege-escalation.md
      adapted_from: null
    - reading: sections/section-040/module-02/course-03-privileged-containers-and-verifying-process-privileges.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-040/module-02/labs/lab-01
      after_reading: sections/section-040/module-02/course-02-non-root-identity-and-privilege-escalation.md
      objective: Run a workload as a non-root user with no Linux capabilities and no way to gain privileges.
      status: alpha
      runtime_verification: pending
    quiz: sections/section-040/module-02/quiz.yaml
  - id: module-03
    title: Host Mounts And Replacement-Based Updates
    objectives:
    - Explain the risk of hostPath volumes and mount a volume read-only.
    - Change a workload by replacement through its Deployment template.
    - Compare the running image digest with the approved image.
    outline:
    - Volumes That Reach The Host
    - Updating By Replacement
    - Pinning Images And Detecting Drift
    playground: true
    module_lab: true
    sources:
    - reading: sections/section-040/module-03/course-01-volumes-that-reach-the-host.md
      adapted_from: null
    - reading: sections/section-040/module-03/course-02-updating-by-replacement.md
      adapted_from: null
    - reading: sections/section-040/module-03/course-03-pinning-images-and-detecting-drift.md
      adapted_from: null
    labs:
    - id: lab-01
      path: sections/section-040/module-03/labs/lab-01
      after_reading: sections/section-040/module-03/course-02-updating-by-replacement.md
      objective: Replace the Pods of a Deployment through its template so that they run version v2 with
        a read-only root filesystem and a writable temporary path.
      status: alpha
      runtime_verification: pending
    quiz: sections/section-040/module-03/quiz.yaml
  capstone_lab:
    path: sections/section-040/capstone/labs/lab-01
    objective: Harden a Deployment and add an admission rule that rejects new Pods with a writable root
      filesystem in one namespace.
    difficulty: advanced
    status: alpha
    runtime_verification: pending
- id: section-050
