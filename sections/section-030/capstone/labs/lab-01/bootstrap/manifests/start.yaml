apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels:
    project: ckad
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
  labels:
    project: outpost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-code
  namespace: starfleet
data:
  server.py: "from http.server import BaseHTTPRequestHandler, HTTPServer\nfrom pathlib\
    \ import Path\nimport os\nimport socket\n\nclass Handler(BaseHTTPRequestHandler):\n\
    \    def do_GET(self):\n        marker = {\"/ready\": \"/tmp/not-ready\", \"/health\"\
    : \"/tmp/unhealthy\"}.get(self.path)\n        status = 503 if marker and Path(marker).exists()\
    \ else 200\n        settings = Path(\"/settings/greeting\")\n        greeting\
    \ = settings.read_text().strip() if settings.exists() else os.getenv(\"GREETING\"\
    , \"hello\")\n        body = f\"version={os.getenv('VERSION', 'v1')} host={socket.gethostname()}\
    \ greeting={greeting}\\n\"\n        self.send_response(status)\n        self.send_header(\"\
    Content-Type\", \"text/plain\")\n        self.end_headers()\n        self.wfile.write(body.encode())\n\
    \nHTTPServer((\"0.0.0.0\", 8080), Handler).serve_forever()\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: probe
      release: probe
  template:
    metadata:
      labels:
        app: probe
        release: probe
    spec:
      containers:
      - name: probe
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - /app/server.py
        env:
        - name: VERSION
          value: v1
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: app
          mountPath: /app
          readOnly: true
      volumes:
      - name: app
        configMap:
          name: probe-code
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
    release: probe
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost
  labels:
    app: drifter
spec:
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
  restartPolicy: Never
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: threat-reader
  namespace: starfleet
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: threat-code
  namespace: starfleet
data:
  request.py: "from pathlib import Path\nimport ssl,urllib.request,urllib.error\n\
    root=Path('/var/run/secrets/kubernetes.io/serviceaccount')\nrequest=urllib.request.Request('https://kubernetes.default.svc/api/v1/namespaces/starfleet/secrets/audit-token',headers={'Authorization':'Bearer\
    \ '+(root/'token').read_text()})\ntry:\n    urllib.request.urlopen(request,context=ssl.create_default_context(cafile=str(root/'ca.crt')),timeout=5)\n\
    \    raise RuntimeError('Unexpected secret permission')\nexcept urllib.error.HTTPError\
    \ as error:\n    assert error.code==403\n    print('denied-secret-read')\n"
---
apiVersion: v1
kind: Pod
metadata:
  name: threat-client
  namespace: starfleet
spec:
  restartPolicy: Never
  containers:
  - name: client
    image: docker.io/library/python:3.13-alpine
    command:
    - sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: code
      mountPath: /app
      readOnly: true
  serviceAccountName: threat-reader
  volumes:
  - name: code
    configMap:
      name: threat-code
---
apiVersion: v1
kind: Secret
metadata:
  name: audit-token
  namespace: starfleet
type: Opaque
stringData:
  token: audit-disposable
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-helper
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe-reader
  namespace: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-sync
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-sync
  template:
    metadata:
      labels:
        app: cache-sync
    spec:
      serviceAccountName: build-helper
      containers:
      - name: sync
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - echo "syncing to $UPSTREAM"; sleep 3600
        env:
        - name: UPSTREAM
          value: 203.0.113.9
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-helper-edit
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: build-helper
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: probe-reader-view
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: probe-reader
  namespace: starfleet
---
apiVersion: v1
kind: Pod
metadata:
  name: intruder
  namespace: outpost
  labels:
    app: intruder
spec:
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - while true; do wget -q -T 2 -O /dev/null http://probe.starfleet.svc.cluster.local/ || true; sleep 5; done
  restartPolicy: Never
