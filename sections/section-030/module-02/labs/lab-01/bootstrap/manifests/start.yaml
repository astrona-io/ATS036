apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
  labels:
    project: ckad
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: build-helper
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe-reader
  namespace: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-sync
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache-sync
  template:
    metadata:
      labels:
        app: cache-sync
    spec:
      serviceAccountName: build-helper
      containers:
      - name: sync
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - echo "syncing to $UPSTREAM"; sleep 3600
        env:
        - name: UPSTREAM
          value: 203.0.113.9
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: build-helper-edit
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: build-helper
  namespace: starfleet
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: probe-reader-view
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
- kind: ServiceAccount
  name: probe-reader
  namespace: starfleet
