apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-030-02-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: persistence-finding
    description: The report preserves the persistence and authority relationships
    type: file
    source: validation/validate-persistence-finding.sh
    points: 1
  - name: stop-persistence
    description: The Deployment remains as evidence with no running Pods
    type: file
    source: validation/validate-stop-persistence.sh
    points: 1
  - name: revoke-authority
    description: The attacker RoleBinding is removed
    type: file
    source: validation/validate-revoke-authority.sh
    points: 1
