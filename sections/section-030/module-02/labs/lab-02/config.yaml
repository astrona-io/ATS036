apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-030-02-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: cronjob-finding
    description: The finding names the CronJob, its ServiceAccount and the hostPID setting of its Pod template
    type: file
    source: validation/validate-cronjob-finding.sh
    points: 1
  - name: cronjob-suspended
    description: CronJob node-report is suspended and kept, and none of its Jobs or Pods still run
    type: file
    source: validation/validate-cronjob-suspended.sh
    points: 1
