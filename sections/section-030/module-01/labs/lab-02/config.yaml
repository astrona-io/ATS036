apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-030-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: pod-quarantined
    description: The original threat-client Pod carries incident=quarantine and still runs as evidence
    type: file
    source: validation/validate-pod-quarantined.sh
    points: 1
  - name: quarantine-policy
    description: NetworkPolicy quarantine denies all ingress and egress for Pods labelled incident=quarantine
    type: file
    source: validation/validate-quarantine-policy.sh
    points: 1
  - name: token-revoked
    description: No long-lived token Secret for threat-reader remains
    type: file
    source: validation/validate-token-revoked.sh
    points: 1
  - name: access-revoked
    description: threat-reader can no longer read Secrets while probe-reader keeps its access
    type: file
    source: validation/validate-access-revoked.sh
    points: 1
