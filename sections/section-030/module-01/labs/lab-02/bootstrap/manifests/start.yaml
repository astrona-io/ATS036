apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-036-030-01-02
  labels:
    project: starfleet-036-030-01-02
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: threat-reader
  namespace: starfleet-036-030-01-02
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: probe-reader
  namespace: starfleet-036-030-01-02
---
apiVersion: v1
kind: Secret
metadata:
  name: threat-reader-token
  namespace: starfleet-036-030-01-02
  annotations:
    kubernetes.io/service-account.name: threat-reader
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: probe-settings
  namespace: starfleet-036-030-01-02
type: Opaque
stringData:
  endpoint: probe.internal
  password: lab-disposable
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: starfleet-036-030-01-02
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: threat-reader-secrets
  namespace: starfleet-036-030-01-02
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
- kind: ServiceAccount
  name: threat-reader
  namespace: starfleet-036-030-01-02
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: probe-reader-secrets
  namespace: starfleet-036-030-01-02
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
- kind: ServiceAccount
  name: probe-reader
  namespace: starfleet-036-030-01-02
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet-036-030-01-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      serviceAccountName: probe-reader
      terminationGracePeriodSeconds: 5
      containers:
      - name: probe
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 86400
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: threat-client
  namespace: starfleet-036-030-01-02
  labels:
    app: threat-client
spec:
  serviceAccountName: threat-reader
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 86400
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi
