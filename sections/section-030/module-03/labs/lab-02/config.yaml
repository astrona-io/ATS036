apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-030-03-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: impact-report
    description: The report names the Deployment without resource limits and the Pod
      whose container was OOMKilled
    type: file
    source: validation/validate-impact-report.sh
    points: 1
  - name: workload-limited
    description: The cruncher Deployment runs with CPU and memory requests and limits
    type: file
    source: validation/validate-workload-limited.sh
    points: 1
  - name: namespace-defaults
    description: A LimitRange gives new containers in the namespace default CPU and
      memory limits
    type: file
    source: validation/validate-namespace-defaults.sh
    points: 1
