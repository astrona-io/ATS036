# Final domain knowledge check across all sections.
schema_version: 1
kind: question_bank
id: ats036-final
course_id: ATS036
exam_code: CKS
status: draft
provenance: Original practice material; not official exam questions.
scope:
  type: domain
  id: final
  title: Final Domain Quiz
questions:
- id: ats036-final-030-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Find the object behind a returning Pod.
  source_readings:
  - sections/section-030/module-02/course-01-persistence-in-workload-templates-and-schedules.md
  prompt: A suspicious Pod returns after you delete it. Which action stops it from
    returning while keeping the evidence?
  options:
  - id: a
    text: Delete the Pod again and again
    explanation: The ReplicaSet creates a new Pod each time.
  - id: b
    text: Save the Deployment and logs, then scale the Deployment to zero
    explanation: Correct. The controller stops creating Pods and the object stays
      for the record.
  - id: c
    text: Restart the kubelet
    explanation: The kubelet does not own the template.
  correct_option: b
  explanation: Stop the controller after you preserve its template.
- id: ats036-final-030-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Map a client address in an access log to its Pod.
  source_readings:
  - sections/section-030/module-03/course-01-lateral-movement-and-network-evidence.md
  prompt: An access log line starts with the address 10.244.1.9. How do you find the
    Pod that sent the request?
  options:
  - id: a
    text: Read the Pod name from the first field of the log line
    explanation: The first field is an address, not a name.
  - id: b
    text: Ask the Service for its endpoints
    explanation: Endpoints list the targets, not the clients.
  - id: c
    text: Search the `IP` column of `kubectl get pods -A -o wide` and check the Pod
      age against the log time
    explanation: Correct. The IP column maps the address, and the age check avoids
      a reused address.
  correct_option: c
  explanation: Map the address and check the timing.
- id: ats036-final-030-q03
  type: single_choice
  difficulty: advanced
  learning_objective: Combine the evidence of persistence and authority.
  source_readings:
  - sections/section-030/module-02/course-02-privilege-escalation-through-bindings-and-pod-settings.md
  prompt: A Deployment runs as a ServiceAccount that has the ClusterRole `edit` in
    its namespace. Which statement is correct?
  options:
  - id: a
    text: Both the Deployment and the binding are part of the incident and need separate
      containment
    explanation: Correct. The Deployment keeps the code running and the binding gives
      it authority.
  - id: b
    text: Removing the Deployment also removes the binding
    explanation: A RoleBinding is a separate object.
  - id: c
    text: The role applies in every namespace
    explanation: A RoleBinding limits the role to its own namespace.
  correct_option: a
  explanation: Contain the workload and the authority separately.
- id: ats036-final-040-02-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Remove all capabilities.
  source_readings:
  - sections/section-040/module-02/course-01-linux-capabilities-and-what-a-container-starts-with.md
  prompt: Which setting removes every capability from a container?
  options:
  - id: a
    text: '`capabilities.drop: ["ALL"]` in the container `securityContext`'
    explanation: Correct. It empties the capability set.
  - id: b
    text: '`capabilities.drop: ["ALL"]` in the Pod `securityContext`'
    explanation: The field exists only at container level.
  - id: c
    text: "`allowPrivilegeEscalation: false`"
    explanation: This sets `no_new_privs` and does not remove capabilities.
  correct_option: a
  explanation: Drop ALL at container level.
- id: ats036-final-040-02-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Explain no_new_privs.
  source_readings:
  - sections/section-040/module-02/course-02-non-root-identity-and-privilege-escalation.md
  prompt: 'What does `allowPrivilegeEscalation: false` set?'
  options:
  - id: a
    text: The `no_new_privs` flag on the process
    explanation: Correct. A started program cannot gain more privileges than its parent.
  - id: b
    text: An empty capability set
    explanation: Capabilities are dropped separately.
  - id: c
    text: A read-only root filesystem
    explanation: That is `readOnlyRootFilesystem`.
  correct_option: a
  explanation: It sets no_new_privs.
- id: ats036-final-040-03-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Define a digest.
  source_readings:
  - sections/section-040/module-03/course-03-pinning-images-and-detecting-drift.md
  prompt: What is an image digest?
  options:
  - id: a
    text: A label that the registry owner can move
    explanation: That describes a tag.
  - id: b
    text: The SHA-256 hash of the image manifest
    explanation: Correct. The same digest always means the same content.
  - id: c
    text: The size of the image
    explanation: Size is not the digest.
  correct_option: b
  explanation: Digest is a content hash.
- id: ats036-final-050-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Name interactive subresources.
  source_readings:
  - sections/section-050/module-02/course-01-subresources-in-audit-policy-rules.md
  prompt: Which subresource opens a tunnel from the client to a port of a Pod?
  options:
  - id: a
    text: "`pods/portforward`"
    explanation: Correct. It forwards a local port to a Pod port.
  - id: b
    text: "`pods/log`"
    explanation: This reads the container log.
  - id: c
    text: "`serviceaccounts/token`"
    explanation: This creates a ServiceAccount token.
  correct_option: a
  explanation: "`pods/portforward` carries the tunnel."
- id: ats036-final-050-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Understand rule order.
  source_readings:
  - sections/section-050/module-02/course-03-choosing-rules-and-levels-for-interactive-access.md
  prompt: 'A rule with `level: None` for the group `system:nodes` is placed above
    the exec rule. What happens to an exec request made by a node identity?'
  options:
  - id: a
    text: It is recorded by the exec rule
    explanation: The first matching rule wins.
  - id: b
    text: It is dropped by the first rule
    explanation: Correct. The request matches the first rule and the later rule is
      not read.
  - id: c
    text: It is recorded at `RequestResponse`
    explanation: No rule sets that level.
  correct_option: b
  explanation: Order decides which rule matches.
- id: ats036-final-050-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Compute the disk use.
  source_readings:
  - sections/section-050/module-03/course-01-rotation-flags-and-disk-use.md
  prompt: The flags are `maxsize=10` and `maxbackup=2`, without compression. What
    is the largest disk use of the log?
  options:
  - id: a
    text: About 20 megabytes
    explanation: This counts only two files.
  - id: b
    text: About 30 megabytes
    explanation: Correct. Two rotated files plus the active file are three files of
      10 megabytes.
  - id: c
    text: About 10 megabytes
    explanation: This counts only one file.
  correct_option: b
  explanation: Size times backups plus the active file.
- id: ats036-final-020-02-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Name the component that writes Pod start events.
  source_readings:
  - sections/section-020/module-02/course-01-kubernetes-events-as-a-short-lived-signal.md
  prompt: Which component writes the events `Pulled`, `Created` and `Started` for
    a Pod?
  options:
  - id: a
    text: The kubelet on the node
    explanation: Correct. The kubelet prepares and starts the containers and reports
      each step.
  - id: b
    text: The scheduler
    explanation: The scheduler writes `Scheduled` and `FailedScheduling`.
  - id: c
    text: The Service controller
    explanation: It does not manage containers.
  correct_option: a
  explanation: The kubelet reports container start steps.
- id: ats036-final-020-03-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Name the account of a Pod without a ServiceAccount.
  source_readings:
  - sections/section-020/module-03/course-01-serviceaccounts-and-user-identity.md
  prompt: A Pod does not set `serviceAccountName`. Which ServiceAccount does it use?
  options:
  - id: a
    text: "`default` of its namespace"
    explanation: Correct. Kubernetes creates it in every namespace.
  - id: b
    text: None
    explanation: The Pod always has an identity.
  - id: c
    text: "`kube-system:admin`"
    explanation: No such default exists.
  correct_option: a
  explanation: The `default` ServiceAccount is used.
- id: ats036-final-020-03-q09
  type: single_choice
  difficulty: beginner
  learning_objective: Judge base64 protection.
  source_readings:
  - sections/section-020/module-03/course-03-secret-exposure-paths.md
  prompt: What protection does the base64 form of a Secret value give?
  options:
  - id: a
    text: None, it is an encoding that anyone can reverse
    explanation: Correct. `base64 -d` returns the original text.
  - id: b
    text: It encrypts the value in etcd
    explanation: Encryption at rest needs an `EncryptionConfiguration`.
  - id: c
    text: It hides the value from `kubectl exec`
    explanation: The container sees the decoded value.
  correct_option: a
  explanation: Base64 is not encryption.
- id: ats036-final-s010-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Scope a runtime detection rule.
  source_readings:
  - sections/section-010/module-02/course-02-scope-a-shell-rule-to-a-namespace.md
  prompt: Which condition best limits a shell rule to containers of the starfleet
    namespace?
  options:
  - id: a
    text: spawned_process and k8s.ns.name = starfleet
    explanation: Without the container macro the rule also matches shells on the node.
  - id: b
    text: spawned_process and container and k8s.ns.name = starfleet and proc.name
      in (sh, bash, ash)
    explanation: Correct. It combines process creation, container scope, the namespace
      and shell names.
  - id: c
    text: proc.name = bash
    explanation: This matches no scope and misses sh and ash.
  correct_option: b
  explanation: Combine process creation, the container macro, the namespace and the
    shell names.
- id: ats036-final-s010-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Tune a rule with an exception.
  source_readings:
  - sections/section-010/module-02/course-03-exceptions-testing-and-limits-of-a-rule.md
  prompt: A shell rule fires for an approved start-up script. What is the best fix?
  options:
  - id: a
    text: Disable the rule
    explanation: A disabled rule detects nothing.
  - id: b
    text: Add an exception on namespace, container, parent process and command line
    explanation: Correct. A narrow exception keeps the rule useful.
  - id: c
    text: Ignore every shell in the namespace
    explanation: That is an exception that is too broad.
  correct_option: b
  explanation: Use a narrow exception with several fields.
- id: ats036-final-s010-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Find exec requests in the audit log.
  source_readings:
  - sections/section-010/module-03/course-01-exec-and-port-forward-in-the-audit-log.md
  prompt: Which audit policy entry makes the API server record kubectl exec requests?
  options:
  - id: a
    text: The resource pods only
    explanation: A rule for pods does not match its subresources.
  - id: b
    text: The resource pods/exec
    explanation: Correct. The subresource is listed by its own name.
  - id: c
    text: The resource events
    explanation: Events do not describe exec requests.
  correct_option: b
  explanation: List pods/exec in the policy.
