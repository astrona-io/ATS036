id: ats036-010-01
course_id: ATS036
exam_code: CKS
status: alpha
provenance: Original practice material; not official exam questions.
scope:
  type: section
  id: section-010/module-01
  title: "Behavioral Detection With Runtime Context"
placement:
  position: after
  reading: sections/section-010/module-01/course-05-summary.md
questions:
  - id: ats036-010-01-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose the source of a workload baseline."
    source_readings:
      - sections/section-010/module-01/course-01-expected-behavior-of-a-workload.md
    prompt: "You must write the expected behavior of a new web workload before you enable runtime rules. Which source do you start from?"
    options:
      - id: a
        text: "A week of observed behavior of the running Pods"
        explanation: "Observation can contain the actions of an attacker if the workload is already compromised. It corrects a baseline but should not define it."
      - id: b
        text: "The Pod specification and the purpose of the application"
        explanation: "Correct. The specification declares the command, port and ServiceAccount, and the purpose says what the application may do."
      - id: c
        text: "The default rule set of the sensor"
        explanation: "Default rules are generic. They do not know what this workload is supposed to do."
    correct_option: b
    explanation: "Start from the specification and the application purpose, then use observation to refine the baseline."

  - id: ats036-010-01-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Explain why a node sensor sees all containers."
    source_readings:
      - sections/section-010/module-01/course-02-syscalls-ebpf-and-falco-rules.md
    prompt: "A sensor runs on a node and watches system calls. Why can it see the system calls of every container on that node?"
    options:
      - id: a
        text: "Every container runs its own kernel and reports to the sensor"
        explanation: "Containers do not have their own kernel."
      - id: b
        text: "Containers are Linux processes that make system calls to the kernel of the node"
        explanation: "Correct. All containers on the node share one kernel, so one sensor sees them all."
      - id: c
        text: "The kubelet copies every system call into the sensor"
        explanation: "The kubelet does not copy system calls. The sensor reads them from a driver in the kernel."
    correct_option: b
    explanation: "Containers share the kernel of the node. A kernel driver can therefore capture the system calls of all of them."

  - id: ats036-010-01-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the Falco rule fields."
    source_readings:
      - sections/section-010/module-01/course-02-syscalls-ebpf-and-falco-rules.md
    prompt: "In a Falco rule, which field holds the filter over event fields such as `proc.name` and `k8s.ns.name`?"
    options:
      - id: a
        text: "`output`"
        explanation: "`output` is the alert text with placeholders."
      - id: b
        text: "`condition`"
        explanation: "Correct. The condition is the filter that decides whether an event matches the rule."
      - id: c
        text: "`priority`"
        explanation: "`priority` sets the severity of the alert, for example `WARNING`."
    correct_option: b
    explanation: "The `condition` field is the filter. `output` is the message and `priority` is the severity."

  - id: ats036-010-01-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Interpret a Falco rule match."
    source_readings:
      - sections/section-010/module-01/course-02-syscalls-ebpf-and-falco-rules.md
    prompt: "Falco writes a `WARNING` alert that a shell started in a `probe` container. What does the alert prove?"
    options:
      - id: a
        text: "The event matched the rule, but it does not prove that anything was prevented or that it was an attack"
        explanation: "Correct. A rule match is an alert about an event that already happened. Context decides if it is an attack."
      - id: b
        text: "The shell was blocked before it ran"
        explanation: "Falco detects events. It does not prevent them unless a separate response is configured."
      - id: c
        text: "The container image is compromised"
        explanation: "A shell can come from approved maintenance. The alert alone does not prove a compromised image."
    correct_option: a
    explanation: "An alert is a hypothesis about an event. It is neither proof of compromise nor proof of prevention."

  - id: ats036-010-01-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the level of an audit policy."
    source_readings:
      - sections/section-010/module-01/course-03-audit-records-as-behavioral-evidence.md
    prompt: "An audit policy rule sets the level `Metadata` for `secrets` in the namespace `starfleet`. Which statement about a recorded Secret read is true?"
    options:
      - id: a
        text: "The event holds the Secret data in `responseObject`"
        explanation: "`responseObject` is kept only at the level `RequestResponse`."
      - id: b
        text: "The event names the user, verb, object, stage and result, without request or response bodies"
        explanation: "Correct. `Metadata` records who did what and the result, but not the bodies."
      - id: c
        text: "No event is written, because Secrets are excluded at this level"
        explanation: "`Metadata` writes an event. The level `None` writes nothing."
    correct_option: b
    explanation: "The level `Metadata` keeps the request metadata and leaves out request and response bodies."

  - id: ats036-010-01-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read an audit event for a denied request."
    source_readings:
      - sections/section-010/module-01/course-03-audit-records-as-behavioral-evidence.md
    prompt: "An audit event has `verb: get`, resource `secrets`, `stage: ResponseComplete` and `responseStatus.code: 403`. What does it show?"
    options:
      - id: a
        text: "The ServiceAccount read the Secret successfully"
        explanation: "A `403` is a denial. No data is returned."
      - id: b
        text: "The request was never authenticated"
        explanation: "A request that is denied with `403` was authenticated first. An unauthenticated request gets `401`."
      - id: c
        text: "The authenticated identity asked for the Secret and the API server denied the request"
        explanation: "Correct. The user is known, and the authorization decision was a denial."
    correct_option: c
    explanation: "Status `403` means authenticated and then forbidden. The record shows an attempt, not a read."

  - id: ats036-010-01-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Pick the right stage for a result."
    source_readings:
      - sections/section-010/module-01/course-03-audit-records-as-behavioral-evidence.md
    prompt: "The playground policy sets `omitStages: [RequestReceived]`. Why does a finding about a request result use the `ResponseComplete` event?"
    options:
      - id: a
        text: "`ResponseComplete` is written after the answer and carries the response status"
        explanation: "Correct. The result of the request is only known at the end of handling."
      - id: b
        text: "`RequestReceived` events are always deleted after one hour"
        explanation: "Events are not deleted by stage. The policy only chooses which stages are written."
      - id: c
        text: "`ResponseComplete` is the only stage that has an `auditID`"
        explanation: "All stages of one request carry the same `auditID`."
    correct_option: a
    explanation: "Only the later stages know the outcome. `RequestReceived` is written before the API server has an answer."

  - id: ats036-010-01-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Tune a noisy rule without losing coverage."
    source_readings:
      - sections/section-010/module-01/course-04-triage-tuning-and-response.md
    prompt: "A rule for shells in `probe` fires every time an approved start-up script `healthcheck.sh` runs `sh`. What is the best change?"
    options:
      - id: a
        text: "Disable the rule"
        explanation: "This also removes detection of unapproved shells."
      - id: b
        text: "Lower the priority to `DEBUG`"
        explanation: "The attack is then still reported, but at a priority nobody watches."
      - id: c
        text: "Add a narrow exception for the parent process `healthcheck.sh`"
        explanation: "Correct. The approved case no longer matches and every other shell still does."
    correct_option: c
    explanation: "Tune by narrowing the condition or adding an exception. Do not remove the rule."

  - id: ats036-010-01-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Quarantine a Pod that a Deployment manages."
    source_readings:
      - sections/section-010/module-01/course-04-triage-tuning-and-response.md
    prompt: "A `probe` Pod behaves suspiciously. You want to stop its traffic and keep it for analysis, while the Deployment keeps two healthy replicas. What do you do?"
    options:
      - id: a
        text: "Delete the Pod"
        explanation: "The Pod and its volatile state are lost, and the Deployment creates a replacement."
      - id: b
        text: "Change the label that the Deployment and Service select, so the Pod leaves both"
        explanation: "Correct. The ReplicaSet creates a replacement and the original Pod stays for analysis."
      - id: c
        text: "Scale the Deployment to zero"
        explanation: "This stops the whole application and deletes the Pods."
    correct_option: b
    explanation: "Changing the selected label orphans the Pod. It keeps running, gets no Service traffic, and is replaced in the ReplicaSet."

  - id: ats036-010-01-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Decide which evidence supports a conclusion."
    source_readings:
      - sections/section-010/module-01/course-03-audit-records-as-behavioral-evidence.md
    prompt: "The audit log shows a `403` for a Secret request from `system:serviceaccount:starfleet:threat-reader`. Which conclusion is supported by this record alone?"
    options:
      - id: a
        text: "A named person tried to steal the Secret"
        explanation: "The record names the ServiceAccount identity, not a person."
      - id: b
        text: "A process in the Pod `threat-client` ran a shell"
        explanation: "The audit log does not show processes in containers."
      - id: c
        text: "A request with the identity of the `threat-reader` ServiceAccount was denied"
        explanation: "Correct. The record supports the identity, the resource and the result, and nothing more."
    correct_option: c
    explanation: "State only what the record shows: the authenticated identity, the object and the result."
