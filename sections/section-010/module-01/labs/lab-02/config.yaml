apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-010-01-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: evidence-container
    description: An ephemeral container named evidence ran in the suspect Pod and
      targeted its probe container
    type: file
    source: validation/validate-evidence-container.sh
    points: 1
  - name: pod-quarantined
    description: The suspect Pod keeps running with the same UID, without its app
      and release labels and with quarantine=true
    type: file
    source: validation/validate-pod-quarantined.sh
    points: 1
  - name: service-excludes
    description: The probe Service no longer sends traffic to the suspect Pod and
      the Deployment again has two available replicas
    type: file
    source: validation/validate-service-excludes.sh
    points: 1
