apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-010-02-03
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # Falco watches real kernel events on the node and reads Pod metadata from
  # containerd, so the lab runs a VM with a one-node kubeadm cluster. The
  # image ships Falco 0.45.2 with the modern eBPF driver; bootstrap/setup.sh
  # starts falco-modern-bpf.service.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: namespace-detection
    description: New shells in the reporter Pod of starfleet-036-010-02-03 raise Training namespace shell alerts with the namespace, Pod name and Pod UID
    type: file
    source: vm/validate-namespace-detection.sh
    points: 1
  - name: scoped-exceptions
    description: The approved command and a shell in outpost-036-010-02-03 raise no alert while a later shell in the monitored Pod still does
    type: file
    source: vm/validate-scoped-exceptions.sh
    points: 1
