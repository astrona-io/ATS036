apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-010-02-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # Falco watches real kernel events on the node, so the lab runs a VM with
  # a one-node kubeadm cluster. The image ships Falco 0.45.2 with the modern
  # eBPF driver; bootstrap/setup.sh starts falco-modern-bpf.service.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks-20261122
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: shell-alerts
    description: New sh and bash shells of probe-user raise Unexpected probe shell alerts with priority WARNING, the command line and the account
    type: file
    source: vm/validate-shell-alerts.sh
    points: 1
  - name: scoped-exception
    description: The approved maintenance command and shells of other-user raise no alert while a later probe-user shell still does
    type: file
    source: vm/validate-scoped-exception.sh
    points: 1
