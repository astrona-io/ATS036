apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-010-03-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: exec-record
    description: The correlation names a real pods/exec audit record, the Pod that received it and the target container
    type: file
    source: validation/validate-exec-record.sh
    points: 1
  - name: runtime-location
    description: The correlation names the node that runs the Pod and the container ID of the exec target container
    type: file
    source: validation/validate-runtime-location.sh
    points: 1
