apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-050-03-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  # The task changes the audit inputs of the kube-apiserver static pod and
  # reads a collector on the node, so the lab runs a real one-node kubeadm
  # cluster in a VM.
  type: qemu
  qemu:
  - image:
      type: oci
      source: ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-cks
    cpus: 2
    memoryMB: 4096
    diskSizeGB: 25
    display: false
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: vm/install.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    description: Verify the starting state and reject the unfinished lab
    type: file
    source: vm/verify-start.sh
  - name: reference-result
    type: file
    source: vm/apply-solution.sh
  - name: wait-solved
    description: Wait until the reference solution settles and every outcome passes
    type: file
    source: vm/wait-solved.sh
validation:
  scripts:
  - name: remote-delivery
    description: With the right token and a verified TLS certificate, fresh create events of the scoped namespace reach the collector outside the kube-apiserver Pod
    type: file
    source: vm/validate-remote-delivery.sh
    points: 1
  - name: metadata-boundary
    description: The collector receives only Metadata events for Secrets and ConfigMaps of starfleet-036-050-03-02, with no bodies, no RequestReceived stage and nothing from outpost-036-050-03-02
    type: file
    source: vm/validate-metadata-boundary.sh
    points: 1
