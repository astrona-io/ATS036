apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-050-02-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: policy-order
    description: The policy file sends pods/exec and pods/portforward to a Metadata rule and still drops pods/log and pods/status
    type: file
    source: validation/validate-policy-order.sh
    points: 1
  - name: exec-recorded
    description: A new exec request in Pod shuttle leaves a Metadata audit record without bodies
    type: file
    source: validation/validate-exec-recorded.sh
    points: 1
  - name: portforward-recorded
    description: A port-forward request in starfleet-036-050-02-02 left a Metadata audit record without bodies
    type: file
    source: validation/validate-portforward-recorded.sh
    points: 1
