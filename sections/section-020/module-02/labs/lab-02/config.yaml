apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-020-02-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: failed-count
    description: The report records the number of failed login lines in the live application log
    type: file
    source: validation/validate-failed-count.sh
    points: 1
  - name: attacker-detail
    description: The report names the user and the source address of the repeated failures
    type: file
    source: validation/validate-attacker-detail.sh
    points: 1
  - name: success-after-failures
    description: The report names the user that logged in from the failing source address after the failures
    type: file
    source: validation/validate-success-after-failures.sh
    points: 1
