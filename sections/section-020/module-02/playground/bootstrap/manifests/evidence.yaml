apiVersion: v1
kind: Pod
metadata:
  name: suspect-pod
  namespace: starfleet
  labels:
    app: suspect
spec:
  containers:
  - name: tool
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
    securityContext:
      privileged: true
    volumeMounts:
    - name: node-config
      mountPath: /host-etc
      readOnly: true
  volumes:
  - name: node-config
    hostPath:
      path: /etc
      type: Directory
---
apiVersion: v1
kind: Pod
metadata:
  name: login-service
  namespace: starfleet
  labels:
    app: login-service
spec:
  containers:
  - name: login
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - 'for attempt in 1 2 3 4 5; do echo "login failed user=admin"; done; echo "login ok user=ops"; sleep 3600'
