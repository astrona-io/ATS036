apiVersion: v1
kind: Pod
metadata:
  name: crash-report
  namespace: starfleet-036-020-01-01
spec:
  restartPolicy: Always
  containers:
  - name: report
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - printf "application-started\n"; if [ ! -f /state/crashed ]; then touch /state/crashed; sleep 2; exit 12; fi; sleep 86400
    volumeMounts:
    - name: state
      mountPath: /state
  volumes:
  - name: state
    emptyDir: {}
