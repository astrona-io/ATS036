schema_version: 1
kind: question_bank
id: ats036-020-01
course_id: ATS036
exam_code: CKS
status: draft
provenance: Original practice material; not official exam questions.
scope:
  type: section
  id: section-020/module-01
  title: "Security Observability And Evidence Quality"
placement:
  position: after
  reading: sections/section-020/module-01/course-04-summary.md
questions:
  - id: ats036-020-01-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose the evidence source for the user layer."
    source_readings:
      - sections/section-020/module-01/course-01-security-signals-by-layer.md
    prompt: "You want to know which authenticated user called the Kubernetes API to read a Secret. Which source holds this?"
    options:
      - id: a
        text: "The kubelet log on the worker node"
        explanation: "The kubelet log records container and volume activity on one node, not API requests."
      - id: b
        text: "The Kubernetes audit log"
        explanation: "Correct. Audit events name the authenticated user, the verb and the object."
      - id: c
        text: "The application log of the Pod"
        explanation: "The application log shows what the application printed. It does not show other API calls."
    correct_option: b
    explanation: "The audit log is the source for who called the API."

  - id: ats036-020-01-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "State how long Kubernetes events are kept by default."
    source_readings:
      - sections/section-020/module-01/course-01-security-signals-by-layer.md
    prompt: "Which statement about Kubernetes events is correct?"
    options:
      - id: a
        text: "They are kept in the cluster for one hour by default, set by `--event-ttl`"
        explanation: "Correct. Events are short-lived, so they are not long-term evidence."
      - id: b
        text: "They are kept forever in etcd"
        explanation: "Events expire. The API server removes them after the event time to live."
      - id: c
        text: "They are written to `/var/log/pods` on the node"
        explanation: "Container logs are in `/var/log/pods`. Events are API objects."
    correct_option: a
    explanation: "Events expire after one hour by default. Ship important evidence to a store outside the cluster."

  - id: ats036-020-01-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Read the exit code of a finished container."
    source_readings:
      - sections/section-020/module-01/course-02-workload-logs-restarts-and-exit-evidence.md
    prompt: "Which command prints the exit code of the last finished instance of the container in Pod `crash-report`?"
    options:
      - id: a
        text: "`kubectl -n starfleet get pod crash-report -o jsonpath='{.status.containerStatuses[0].lastState.terminated.exitCode}'`"
        explanation: "Correct. The last terminated state holds the exit code."
      - id: b
        text: "`kubectl -n starfleet logs crash-report`"
        explanation: "This prints a log. The exit code is a field of the Pod status."
      - id: c
        text: "`kubectl -n starfleet get events`"
        explanation: "Events may mention a restart, but the exit code is in the Pod status."
    correct_option: a
    explanation: "The exit code is in `status.containerStatuses[].lastState.terminated.exitCode`."

  - id: ats036-020-01-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the previous log."
    source_readings:
      - sections/section-020/module-01/course-02-workload-logs-restarts-and-exit-evidence.md
    prompt: "A container restarted twenty seconds ago. The current log is empty. Where is the log of the instance that crashed?"
    options:
      - id: a
        text: "In `kubectl logs --previous` for the same container"
        explanation: "Correct. The option reads the log of the last finished instance."
      - id: b
        text: "It is lost, because a restart clears all logs"
        explanation: "The kubelet keeps the last finished instance, so it can still be read."
      - id: c
        text: "In the events of the Pod"
        explanation: "Events say that the container was killed or restarted. They do not hold its log lines."
    correct_option: a
    explanation: "After a restart, the current log is a new instance. Use `--previous` for the one that ended."

  - id: ats036-020-01-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Interpret an exit code above 128."
    source_readings:
      - sections/section-020/module-01/course-02-workload-logs-restarts-and-exit-evidence.md
    prompt: "A container exits with code 137 and the reason `OOMKilled`. What does this mean?"
    options:
      - id: a
        text: "The application returned its own error code 137"
        explanation: "Codes above 128 normally mean a signal, and the reason names the memory limit."
      - id: b
        text: "The kernel ended the container with signal 9 because it used more memory than its limit"
        explanation: "Correct. 137 is 128 plus signal 9, and `OOMKilled` is the memory limit reason."
      - id: c
        text: "The image could not be pulled"
        explanation: "An image pull problem prevents the container from starting. It gives no exit code."
    correct_option: b
    explanation: "137 is 128 plus 9 (`SIGKILL`). With `OOMKilled` it means the memory limit was exceeded."

  - id: ats036-020-01-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find when container logs are lost."
    source_readings:
      - sections/section-020/module-01/course-02-workload-logs-restarts-and-exit-evidence.md
    prompt: "A suspicious Pod is deleted during an incident. Nothing ships its logs to a central store. What happens to its container logs?"
    options:
      - id: a
        text: "They stay on the node until the next reboot"
        explanation: "The kubelet removes the log files of a deleted Pod."
      - id: b
        text: "They move to the Deployment"
        explanation: "A Deployment does not store logs."
      - id: c
        text: "The kubelet removes the files, so they are lost"
        explanation: "Correct. Without a collector that ships logs, deleting the Pod deletes the evidence."
    correct_option: c
    explanation: "Container log files belong to the Pod. Delete the Pod only after you have read or shipped them."

  - id: ats036-020-01-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Attribute a request to a Pod."
    source_readings:
      - sections/section-020/module-01/course-03-network-traffic-application-logs-and-evidence-gaps.md
    prompt: "A `probe` log line shows a request from `10.244.1.23`. How do you find the client Pod?"
    options:
      - id: a
        text: "Match the address in the `IP` column of `kubectl get pods -A -o wide` and record the time of the request"
        explanation: "Correct. A Pod IP address identifies the Pod only at that time, because addresses are reused."
      - id: b
        text: "Look for the address in `kubectl get services`"
        explanation: "Service addresses are cluster IPs of Services, not of client Pods."
      - id: c
        text: "The address always identifies the person who sent the request"
        explanation: "An address identifies a network endpoint. It never identifies a person."
    correct_option: a
    explanation: "Match the address with the Pod list, and keep the time with it."

  - id: ats036-020-01-q08
    type: single_choice
    difficulty: advanced
    learning_objective: "Explain a limit of source-address attribution."
    source_readings:
      - sections/section-020/module-01/course-03-network-traffic-application-logs-and-evidence-gaps.md
    prompt: "Requests reach the `probe` Pods through a load balancer and every log line shows the same address. What is the correct conclusion?"
    options:
      - id: a
        text: "One client sends all requests"
        explanation: "The load balancer or proxy can replace the client address."
      - id: b
        text: "The Pods do not log request addresses"
        explanation: "They log the address they see. The address they see is the problem."
      - id: c
        text: "The logged address is the load balancer or a proxy, so other evidence is needed to find the client"
        explanation: "Correct. Use the access log of the load balancer, which keeps the original client address."
    correct_option: c
    explanation: "A proxy can replace the source address. The proxy's own log can hold the original."

  - id: ats036-020-01-q09
    type: single_choice
    difficulty: advanced
    learning_objective: "Interpret an empty search result."
    source_readings:
      - sections/section-020/module-01/course-03-network-traffic-application-logs-and-evidence-gaps.md
    prompt: "A search of the logs for a connection to the `probe` Service finds no record for a given hour. What is the correct statement?"
    options:
      - id: a
        text: "No record was found in this source for this period, and the causes must be checked"
        explanation: "Correct. The activity may not have happened, or the record may be missing for one of several reasons."
      - id: b
        text: "No connection happened in that hour"
        explanation: "An empty result does not prove it. Rotation, a failed collector or a disabled source give the same result."
      - id: c
        text: "The Service is not working"
        explanation: "A working Service can still have no log line, for example when logging is off."
    correct_option: a
    explanation: "State what was searched and what was found. Do not turn an empty result into proof of no activity."

  - id: ats036-020-01-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Choose an observability fix for a gap."
    source_readings:
      - sections/section-020/module-01/course-03-network-traffic-application-logs-and-evidence-gaps.md
    prompt: "Container logs on a node rotate at the default size, and an investigation needs the logs of a Pod from three days ago. What change closes the gap?"
    options:
      - id: a
        text: "Increase the restart count"
        explanation: "The restart count does not keep logs."
      - id: b
        text: "Delete old Pods so the kubelet writes new files"
        explanation: "This removes more evidence."
      - id: c
        text: "Run a log collector on each node that ships logs to storage with a defined retention time"
        explanation: "Correct. Storage outside the node keeps the logs after rotation and after the Pod is gone."
    correct_option: c
    explanation: "Node files are short-lived. A collector that ships logs to storage with a retention policy keeps them."
