apiVersion: v1
kind: Pod
metadata:
  name: suspect-pod
  namespace: starfleet
  labels:
    app: suspect
spec:
  containers:
  - name: tool
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
    securityContext:
      privileged: true
    volumeMounts:
    - name: node-config
      mountPath: /host-etc
      readOnly: true
  volumes:
  - name: node-config
    hostPath:
      path: /etc
      type: Directory
---
apiVersion: v1
kind: Pod
metadata:
  name: login-service
  namespace: starfleet
  labels:
    app: login-service
spec:
  containers:
  - name: login
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - 'for attempt in 1 2 3 4 5; do echo "login failed user=admin"; done; echo "login ok user=ops"; sleep 3600'
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporter
  namespace: starfleet
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auditor
  namespace: starfleet
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: starfleet
type: Opaque
stringData:
  password: pass-1234
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
  namespace: starfleet
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reporter-secrets
  namespace: starfleet
subjects:
- kind: ServiceAccount
  name: reporter
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: starfleet
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auditor-pods
  namespace: starfleet
subjects:
- kind: ServiceAccount
  name: auditor
  namespace: starfleet
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
---
apiVersion: v1
kind: Pod
metadata:
  name: data-client
  namespace: starfleet
  labels:
    app: data-client
spec:
  serviceAccountName: reporter
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
    env:
    - name: DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-credentials
          key: password
---
apiVersion: v1
kind: Pod
metadata:
  name: crash-report
  namespace: starfleet
spec:
  restartPolicy: Always
  containers:
  - name: report
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - printf "application-started\n"; sleep 2; exit 12
