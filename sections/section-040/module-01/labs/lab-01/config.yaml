apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-040-01-01
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: non-root-identity
    description: Pod restricted-reader runs as UID 1000 with seccomp RuntimeDefault and no ServiceAccount token
    type: file
    source: validation/validate-non-root-identity.sh
    points: 1
  - name: read-only-root
    description: The container has a read-only root filesystem and writes only to its scratch volume
    type: file
    source: validation/validate-read-only-root.sh
    points: 1
