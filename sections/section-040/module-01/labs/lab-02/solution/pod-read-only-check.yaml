apiVersion: v1
kind: Pod
metadata:
  name: read-only-check
spec:
  restartPolicy: Never
  containers:
  - name: main
    image: docker.io/library/busybox:1.37.0
    command: ["sleep", "3600"]
    securityContext:
      readOnlyRootFilesystem: true
  - name: sidecar
    image: docker.io/library/busybox:1.37.0
    command: ["sleep", "3600"]
    securityContext:
      readOnlyRootFilesystem: true
