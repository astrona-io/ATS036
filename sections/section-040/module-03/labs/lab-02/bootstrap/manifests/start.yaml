apiVersion: v1
kind: Namespace
metadata:
  name: starfleet-036-040-03-02
  labels:
    project: starfleet-036-040-03-02
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost-036-040-03-02
  labels:
    project: outpost-036-040-03-02
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: starfleet-036-040-03-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: collector
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - while true; do cat /host-data/approved.txt 2>/dev/null; sleep 30; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: node-data
          mountPath: /host-data
      volumes:
      - name: node-data
        hostPath:
          path: /var/lib/training-036-040-03-02
          type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
  namespace: starfleet-036-040-03-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: relay
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - while true; do cat /host-data/approved.txt 2>/dev/null; sleep 30; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: node-data
          mountPath: /host-data
          readOnly: true
      volumes:
      - name: node-data
        hostPath:
          path: /var/lib/training-036-040-03-02
          type: DirectoryOrCreate
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beacon
  namespace: starfleet-036-040-03-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beacon
  template:
    metadata:
      labels:
        app: beacon
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: beacon
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - while true; do date > /cache/last-run; sleep 30; done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        volumeMounts:
        - name: cache
          mountPath: /cache
      volumes:
      - name: cache
        emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost-036-040-03-02
  labels:
    app: drifter
spec:
  terminationGracePeriodSeconds: 2
  containers:
  - name: client
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
  restartPolicy: Never
