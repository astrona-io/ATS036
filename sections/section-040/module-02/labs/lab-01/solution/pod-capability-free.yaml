apiVersion: v1
kind: Pod
metadata:
  name: capability-free
  namespace: starfleet-036-040-02-01
spec:
  restartPolicy: Never
  containers:
  - name: worker
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
  securityContext:
    runAsNonRoot: true
    runAsUser: 2000
    runAsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
