apiVersion: astrona.io/v1
metadata:
  name: ats-036-lab-040-02-02
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
bootstrap:
  init:
  - name: seed-lab
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: verify-start
    type: file
    source: testing/verify-start.sh
  - name: reference-result
    type: file
    source: solution/apply.sh
  - name: wait-solved
    type: file
    source: testing/wait-solved.sh
validation:
  scripts:
  - name: privileged-finding
    description: ConfigMap privilege-finding records the privileged workload, its container and the Pod that shares the host process namespace
    type: file
    source: validation/validate-privileged-finding.sh
    points: 1
  - name: namespace-enforced
    description: Namespace starfleet-036-040-02-02 enforces the baseline or restricted Pod Security Standard and rejects a privileged Pod
    type: file
    source: validation/validate-namespace-enforced.sh
    points: 1
  - name: workload-replaced
    description: Deployment telemetry-agent runs ready without a privileged container and no Pod in the namespace is privileged or uses hostPID
    type: file
    source: validation/validate-workload-replaced.sh
    points: 1
