apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-agent
  namespace: starfleet-036-040-02-02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-agent
  template:
    metadata:
      labels:
        app: telemetry-agent
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: agent
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 3600
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
