training:
  id: ATS036
  title: 'CKS: Monitoring, Logging and Runtime Security'
  description: 'Detailed reading material and reusable YAML knowledge checks for CKS: Monitoring, Logging
    and Runtime Security. Technical content remains draft. Each module has a playground, a graded lab
    and a knowledge check.'
  certification:
    name: Certified Kubernetes Security Specialist
    code: CKS
    provider: CNCF / Linux Foundation
    domain: Monitoring, Logging and Runtime Security
    weight: 20
    competencies:
    - Perform behavioral analytics to detect malicious activities
    - Detect threats within physical infrastructure, apps, networks, data, users and workloads
    - Investigate and identify phases of attack and bad actors within the environment
    - Ensure immutability of containers at runtime
    - Use Kubernetes audit logs to monitor access
